# Configuración para testing con H2
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate configuración para testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console (opcional, útil para debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging para debugging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# --------------------------------------------------------------------
# FLYWAY COMPLETAMENTE DESHABILITADO - PARA TESTS LEGACY
# --------------------------------------------------------------------
spring.flyway.enabled=false